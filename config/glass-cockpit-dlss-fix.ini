; Glass Cockpit DLSS Fix settings. Saved changes apply while the sim runs (within a second). The ReShade add-on
; also has them in its tab in the ReShade overlay. What each setting does: https://github.com/IFreemz/msfs2024-glass-cockpit-dlss-fix#settings
; Hotkeys in the sim: Ctrl+Shift+F9 fix on/off, Ctrl+Shift+F11 green tint on every fixed screen.
; Standalone: settings window with [hotkeys] settings_window (Ctrl+Shift+F6).
; What the fix is doing: glass-cockpit-dlss-fix-status.txt.
[overlay]
enabled=1
jitter_positive=1
line_smoothing=0
extra_smoothing=0
[advanced]
glass_strength=0
[experimental]
detail_clamp=0
edge_fade=0
angle_softening=0
edge_stretch=0
edge_trim=0
dark_screen_fix=0
seam_fix=0
temporal_aa=0
soft_smoothing=0
stable_edges=0
full_size_sampling=0
calm_glass=0
occlusion_check=0
[hotkeys]
settings_window=Ctrl+Shift+F6
