[Menu]
ShortcutKey = 0x2D
ShortcutKeyRequireCtrl = false
ShortcutKeyRequireAlt = false
OverlayMenu = false
DefaultScale = 1.5

[Upscalers]
Dx12Upscaler = dlss
UseGenericAppIdWithDlss = true

[Spoofing]
Dxgi = true
StreamlineSpoofing = true
SpoofedVendorId = 0x10de
SpoofedDeviceId = @DEVICE_ID@
SpoofedGPUName = @GPU_NAME@
SpoofHAGS = true

[FrameGen]
External = true

[DLSSG]
AmpereMfgUnlock = true
AmpereMfgMode = External
AmpereMfgMaxFrames = 5
AmpereMfgRouter = SM86
AmpereMfgKernelImage = Cubin
AmpereMfgLogLevel = 1

[Log]
LogLevel = 2

[DlssNr]
; Neural rendering starts with the sim. Switching it in flight rebuilds its buffers and can
; overflow 10 GB cards; change it here, before starting the sim.
Enabled = true
; 1 = Original model, 2 = Optimized (small FP8), 0 = runtime default
Preset = 1
; 0 = Standard, 1 = Natural, 2 = Cinematic
Style = 2
; 1 = white point from the game's exposure
WhitePointSource = 1
; model works at half width and height: about a quarter of the cost
WorkingScale = 0.5
; DLSS 1:1 pass before the model (clean, un-jittered input)
DenoiseFirst = true

[Mipmap]
; sharper textures at DLSS render resolution
MipmapBiasOverride = -0.5

[DLSS]
; DLSS preset M for every quality mode (11 = K)
RenderPresetOverride = true
RenderPresetForAll = 13
